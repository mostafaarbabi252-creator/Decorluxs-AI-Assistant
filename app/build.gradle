plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.decorluxs.aiassistant'
    compileSdk 37

    defaultConfig {
        applicationId 'ir.decorluxs.aiassistant'
        minSdk 24
        targetSdk 37
        versionCode 4
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
